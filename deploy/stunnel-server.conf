# Run the CLDT backend as an unprivileged service with CLDT_BIND_IP=127.0.0.1.
# Set a strong nonempty CLDT server token. Expose only port 9443 externally.
# Install a CA-issued certificate chain and restrict private-key permissions.
foreground = yes
pid =

[cldt]
client = no
accept = 0.0.0.0:9443
connect = 127.0.0.1:9000
cert = /etc/cldt/server-chain.pem
key = /etc/cldt/server-key.pem
sslVersionMin = TLSv1.2
options = NO_COMPRESSION
TIMEOUTconnect = 10
TIMEOUTidle = 60
